
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear identificación</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="auth">
        <h1>Crear identificación</h1>

        {% for mensaje in get_flashed_messages() %}
            <p class="error">{{ mensaje }}</p>
        {% endfor %}

        <form method="POST"
              action="{{ url_for('registro') }}">

            <label for="nombre">Nueva identificación</label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                minlength="3"
                maxlength="50"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña</label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                required
            >

            <label for="confirmar">Repetir contraseña</label>

            <input
                type="password"
                id="confirmar"
                name="confirmar"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Crear identificación
            </button>
        </form>

        <p>
            <a href="{{ url_for('login') }}">
                Volver a identificación
            </a>
        </p>
    </main>
</body>
</html>

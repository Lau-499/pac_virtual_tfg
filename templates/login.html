
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Identificación</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="auth">
        <h1>Bienvenido</h1>

        <p>Identifícate para acceder al chatbot</p>

        {% for mensaje in get_flashed_messages() %}
            <p class="error">{{ mensaje }}</p>
        {% endfor %}

        <form method="POST"
              action="{{ url_for('login') }}">

            <label for="nombre">Identificación</label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña</label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Entrar</button>
        </form>

        <p>¿No tienes una identificación?</p>

        <a href="{{ url_for('registro') }}">
            Crear nueva identificación
        </a>
    </main>
</body>
</html>
